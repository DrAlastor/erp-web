name: Despliegue Backend (AWS ECS Fargate + CloudFront)

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar Código Fuente
        uses: actions/checkout@v4

      - name: 2. Autenticar con AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: 3. Autenticar con Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 4. Construir y Publicar Imagen Docker en Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: erp-backend
          IMAGE_TAG: deploy-${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG -t $REGISTRY/$REPOSITORY:latest ./backend
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$REPOSITORY:latest
          echo "IMAGE_URI=$REGISTRY/$REPOSITORY:$IMAGE_TAG" >> $GITHUB_ENV

      - name: 5. Actualizar ECS Fargate y Enrutar CloudFront
        env:
          AWS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_KEY_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          python3 - << 'EOF'
          import json
          import os
          import subprocess
          import time
          from pathlib import Path

          REGION = "us-east-1"
          CLUSTER = "erp-cluster"
          SERVICE = "erp-backend-service"
          TASK_FAMILY = "erp-backend-task"
          DISTRIBUTION_ID = "E391I4EET1AU1X"
          SUFIJO_DNS = ".compute-1.amazonaws.com"
          IMAGE_URI = os.environ["IMAGE_URI"]

          def run_aws(*args):
              cmd = ["aws", "--region", REGION, "--no-cli-pager", *args]
              res = subprocess.run(cmd, capture_output=True, text=True)
              if res.returncode != 0:
                  raise RuntimeError(f"Error AWS CLI: {res.stderr}\n{res.stdout}")
              return res.stdout.strip()

          identidad = json.loads(run_aws("sts", "get-caller-identity"))
          print(f"[*] AWS Autenticado como Cuenta: {identidad.get('Account')}, ARN: {identidad.get('Arn')}")

          print(f"[*] Obteniendo task definition de {TASK_FAMILY}...")
          datos = json.loads(run_aws("ecs", "describe-task-definition", "--task-definition", TASK_FAMILY))
          td = datos["taskDefinition"]
          for k in ["taskDefinitionArn", "revision", "status", "requiresAttributes", "compatibilities", "registeredAt", "registeredBy"]:
              td.pop(k, None)

          td["containerDefinitions"][0]["image"] = IMAGE_URI

          # Actualizar variables de entorno del contenedor para apuntar a la base RDS c49qmms6qw5e
          env_actual = {e["name"]: e["value"] for e in td["containerDefinitions"][0].get("environment", [])}
          print(f"[*] Variables de entorno previas en task: {list(env_actual.keys())}")

          env_nuevas = {
              "DB_URL": "jdbc:postgresql://erp-database.c49qmms6qw5e.us-east-1.rds.amazonaws.com:5432/ERP_Asus",
              "DB_USERNAME": "AdminAWS",
              "DB_PASSWORD": "Adminaws123!",
              "SPRING_DATASOURCE_URL": "jdbc:postgresql://erp-database.c49qmms6qw5e.us-east-1.rds.amazonaws.com:5432/ERP_Asus",
              "SPRING_DATASOURCE_USERNAME": "AdminAWS",
              "SPRING_DATASOURCE_PASSWORD": "Adminaws123!",
              "MASTER_DB_URL": "jdbc:postgresql://erp-database.c49qmms6qw5e.us-east-1.rds.amazonaws.com:5432/ERP_Master",
              "MASTER_DB_USERNAME": "AdminAWS",
              "MASTER_DB_PASSWORD": "Adminaws123!",
              "TENANT_DB_USERNAME": "AdminAWS",
              "TENANT_DB_PASSWORD": "Adminaws123!",
              "PROVISIONING_DB_URL": "jdbc:postgresql://erp-database.c49qmms6qw5e.us-east-1.rds.amazonaws.com:5432/postgres",
              "PROVISIONING_DB_BASE_URL": "jdbc:postgresql://erp-database.c49qmms6qw5e.us-east-1.rds.amazonaws.com:5432",
              "PROVISIONING_DB_USERNAME": "AdminAWS",
              "PROVISIONING_DB_PASSWORD": "Adminaws123!",
              "RDS_HOST": "erp-database.c49qmms6qw5e.us-east-1.rds.amazonaws.com",
              "SPRING_JPA_HIBERNATE_DDL_AUTO": "none",
              "CORS_ORIGIN": "https://erp-contable-comercial.online",
              "TZ": "America/La_Paz",
              "JWT_SECRET": "0793e09c40e6e55bb4c3a9dca66c9798d8ce07e5ed145be87799397c231eabbd",
              "AWS_CLOUDWATCH_ENABLED": "true",
              "AWS_REGION": "us-east-1",
              "AWS_CLOUDWATCH_LOG_GROUP": "/aws/nexoerp/bitacora"
          }

          aws_key = os.environ.get("AWS_KEY_ID", "")
          aws_sec = os.environ.get("AWS_KEY_SECRET", "")
          if aws_key and aws_sec:
              env_nuevas["AWS_ACCESS_KEY_ID"] = aws_key
              env_nuevas["AWS_SECRET_ACCESS_KEY"] = aws_sec

          # Purgar cualquier variable residual del host antiguo coxoq4mwa6sg
          env_combinado = {}
          for k, v in env_actual.items():
              if "coxoq4mwa6sg" not in str(v):
                  env_combinado[k] = v
          env_combinado.update(env_nuevas)

          td["containerDefinitions"][0]["environment"] = [
              {"name": k, "value": str(v)} for k, v in env_combinado.items()
          ]
          print(f"[*] Variables de entorno actualizadas en task: {list(env_combinado.keys())}")

          Path("td-temp.json").write_text(json.dumps(td), encoding="utf-8")
          nuevo = json.loads(run_aws("ecs", "register-task-definition", "--cli-input-json", "file://td-temp.json"))
          Path("td-temp.json").unlink(missing_ok=True)

          nueva_arn = nuevo["taskDefinition"]["taskDefinitionArn"]
          nueva_rev = nuevo["taskDefinition"]["revision"]
          print(f"[+] Nueva revisión registrada: {TASK_FAMILY}:{nueva_rev} ({nueva_arn})")

          # Diagnóstico de Clusters ECS
          clusters = json.loads(run_aws("ecs", "list-clusters")).get("clusterArns", [])
          cluster_names = [c.split("/")[-1] for c in clusters]
          print(f"[*] Clusters ECS disponibles: {cluster_names}")

          if CLUSTER not in cluster_names:
              if cluster_names:
                  print(f"[*] Cluster '{CLUSTER}' no encontrado directamente. Usando cluster existente: '{cluster_names[0]}'")
                  CLUSTER = cluster_names[0]
              else:
                  print(f"[*] Creando cluster ECS '{CLUSTER}'...")
                  run_aws("ecs", "create-cluster", "--cluster-name", CLUSTER)

          # Diagnóstico de Servicios en el Cluster
          servicios = json.loads(run_aws("ecs", "list-services", "--cluster", CLUSTER)).get("serviceArns", [])
          servicio_names = [s.split("/")[-1] for s in servicios]
          print(f"[*] Servicios en cluster '{CLUSTER}': {servicio_names}")

          if SERVICE not in servicio_names:
              candidatos = [s for s in servicio_names if "backend" in s.lower() or "erp" in s.lower()]
              if candidatos:
                  SERVICE = candidatos[0]
                  print(f"[*] Detectado servicio ECS coincidente: '{SERVICE}'. Actualizando...")
                  run_aws("ecs", "update-service", "--cluster", CLUSTER, "--service", SERVICE, "--task-definition", nueva_arn, "--force-new-deployment")
              else:
                  print(f"[!] El servicio '{SERVICE}' no existe en el cluster '{CLUSTER}'. Creándolo automáticamente en ECS Fargate...")
                  subnets_info = json.loads(run_aws("ec2", "describe-subnets"))
                  subnet_ids = [s["SubnetId"] for s in subnets_info.get("Subnets", []) if s.get("MapPublicIpOnLaunch", True)]
                  if not subnet_ids:
                      subnet_ids = [s["SubnetId"] for s in subnets_info.get("Subnets", [])]

                  sgs_info = json.loads(run_aws("ec2", "describe-security-groups"))
                  sg_id = None
                  for sg in sgs_info.get("SecurityGroups", []):
                      gn = sg.get("GroupName", "").lower()
                      if "erp" in gn or "backend" in gn:
                          sg_id = sg["GroupId"]
                          break
                  if not sg_id and sgs_info.get("SecurityGroups"):
                      sg_id = sgs_info["SecurityGroups"][0]["GroupId"]

                  try:
                      run_aws("ec2", "authorize-security-group-ingress",
                              "--group-id", sg_id,
                              "--protocol", "tcp",
                              "--port", "8080",
                              "--cidr", "0.0.0.0/0")
                  except Exception as e:
                      print(f"[*] Nota regla ingress SG: {e}")

                  print(f"[*] Subnets: {subnet_ids[:2]} | SecurityGroup: {sg_id}")
                  net_cfg = f"awsvpcConfiguration={{subnets=[{','.join(subnet_ids[:2])}],securityGroups=[{sg_id}],assignPublicIp=ENABLED}}"
                  run_aws("ecs", "create-service",
                          "--cluster", CLUSTER,
                          "--service-name", SERVICE,
                          "--task-definition", nueva_arn,
                          "--desired-count", "1",
                          "--launch-type", "FARGATE",
                          "--network-configuration", net_cfg)
                  print(f"[+] Servicio '{SERVICE}' creado con éxito en '{CLUSTER}'.")
          else:
              print(f"[*] Actualizando servicio '{SERVICE}' en cluster '{CLUSTER}'...")
              run_aws("ecs", "update-service", "--cluster", CLUSTER, "--service", SERVICE, "--task-definition", nueva_arn, "--force-new-deployment")

          print("[*] Esperando que el nuevo task de ECS inicie y obtenga IP pública...")
          inicio = time.time()
          public_ip = None
          while time.time() - inicio < 420:
              tasks = json.loads(run_aws("ecs", "list-tasks", "--cluster", CLUSTER, "--service-name", SERVICE))
              task_arns = tasks.get("taskArns", [])
              if task_arns:
                  desc = json.loads(run_aws("ecs", "describe-tasks", "--cluster", CLUSTER, "--tasks", *task_arns))
                  for t in desc.get("tasks", []):
                      arn_td = t.get("taskDefinitionArn", "")
                      status = t.get("lastStatus")
                      print(f"    ...Task {t.get('taskArn', '').split('/')[-1]}: status={status}, TD={arn_td.split('/')[-1]}")
                      if arn_td != nueva_arn and not nueva_arn.endswith(arn_td):
                          continue
                      if status == "RUNNING":
                          for att in t.get("attachments", []):
                              if att.get("type") == "ElasticNetworkInterface":
                                  for d in att.get("details", []):
                                      if d.get("name") == "networkInterfaceId":
                                          eni_id = d.get("value")
                                          eni_info = json.loads(run_aws("ec2", "describe-network-interfaces", "--network-interface-ids", eni_id))
                                          public_ip = eni_info["NetworkInterfaces"][0]["Association"]["PublicIp"]
                                          break
                      if public_ip:
                          break
              if public_ip:
                  break
              time.sleep(10)

          if not public_ip:
              raise TimeoutError("No se obtuvo IP pública del nuevo task.")

          print(f"[+] Task activo con IP: {public_ip}")
          dominio = f"ec2-{public_ip.strip().replace('.', '-')}{SUFIJO_DNS}"

          print(f"[*] Actualizando origen de CloudFront ({DISTRIBUTION_ID}) a {dominio}...")
          cf_datos = json.loads(run_aws("cloudfront", "get-distribution-config", "--id", DISTRIBUTION_ID))
          etag = cf_datos["ETag"]
          cfg = cf_datos["DistributionConfig"]

          origen_ant = None
          for origen in cfg["Origins"]["Items"]:
              if "s3" not in origen["DomainName"]:
                  origen_ant = origen["Id"]
                  origen["Id"] = dominio
                  origen["DomainName"] = dominio

          for c in cfg.get("CacheBehaviors", {}).get("Items", []):
              if c["TargetOriginId"] == origen_ant:
                  c["TargetOriginId"] = dominio

          Path("cf-temp.json").write_text(json.dumps(cfg), encoding="utf-8")
          run_aws("cloudfront", "update-distribution", "--id", DISTRIBUTION_ID, "--distribution-config", "file://cf-temp.json", "--if-match", etag)
          Path("cf-temp.json").unlink(missing_ok=True)

          print("[*] Creando invalidación de CloudFront para /api/*...")
          run_aws("cloudfront", "create-invalidation", "--distribution-id", DISTRIBUTION_ID, "--paths", "/api/*")
          print("[+] Despliegue completado con éxito.")
          EOF
