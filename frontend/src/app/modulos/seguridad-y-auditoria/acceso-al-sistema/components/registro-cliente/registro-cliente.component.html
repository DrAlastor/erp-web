<div class="registration-page">
  <section class="registration-card">
    <a routerLink="/login" class="back-link">← Volver al inicio de sesión</a>
    <p class="eyebrow">PORTAL DE CLIENTES</p>
    <h1>Crea tu cuenta</h1>
    <p class="intro">Registra tus datos comerciales para acceder a la experiencia de cliente.</p>

    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <fieldset>
        <legend>Datos de acceso</legend>
        <label>Usuario<input formControlName="username" autocomplete="username" /></label>
        <label>Correo electrónico<input type="email" formControlName="email" autocomplete="email" /></label>
        <label>Contraseña<input type="password" formControlName="password" autocomplete="new-password" /></label>
      </fieldset>
      <fieldset>
        <legend>Datos comerciales</legend>
        <label>Razón social o nombre<input formControlName="razonSocial" /></label>
        <label>NIT/CI<input formControlName="nitCi" /></label>
        <label>Teléfono<input formControlName="telefono" /></label>
        <label>Dirección<input formControlName="direccion" /></label>
      </fieldset>
      <button type="submit" [disabled]="loading()">
        {{ loading() ? 'Creando cuenta...' : 'Crear cuenta de cliente' }}
      </button>
    </form>
  </section>
</div>
