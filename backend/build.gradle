plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.uagrm.erp'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add("-parameters")
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot Web (REST API / MVC)
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Spring Boot Data JPA (Hibernate 6)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // PostgreSQL JDBC Driver
    runtimeOnly 'org.postgresql:postgresql'

    // Spring Security (RBAC y Autenticación)
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // Jakarta Bean Validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Flyway para migraciones versionadas de Base de Datos
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // JWT (JSON Web Token) para autenticación stateless (HU-01)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // AWS CloudWatch Logs para Bitácora de Auditoría Inmutable Externa (CU08)
    implementation platform('software.amazon.awssdk:bom:2.29.50')
    implementation 'software.amazon.awssdk:cloudwatchlogs'

    // Test Starters

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets {
    test {
        java {
            exclude 'modulo/seguridad_y_auditoria/**'
            exclude 'modulo/comercial_y_preventa/**'
            exclude 'modulo/inventario_y_almacenes/**'
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('processResources') {
    from('Base de Datos/ERP_Asus.sql') {
        into 'db/tenant'
    }
}

tasks.named('bootJar') {
    archiveFileName = 'app.jar'
}

tasks.named('jar') {
    enabled = false
}
