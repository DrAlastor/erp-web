# ===================================================================
# CONFIGURACIÓN GENERAL
# ===================================================================
spring.application.name=erp-backend
server.port=${SERVER_PORT:8080}

# ===================================================================
# CONEXIÓN BASE DE DATOS (AWS RDS POSTGRESQL 16: ERP_Asus / ERP_Master)
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://erp-database.coxoq4mwa6sg.us-east-1.rds.amazonaws.com:5432/ERP_Asus}
spring.datasource.username=${DB_USERNAME:AdminAWS}
spring.datasource.password=${DB_PASSWORD:Adminaws123!}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración del Pool HikariCP
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10

# ===================================================================
# JPA / HIBERNATE 6
# ===================================================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================================================================
# FLYWAY (DESACTIVADO: BASE DE DATOS INICIALIZADA MEDIANTE SCRIPTS DDL)
# ===================================================================
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=false

# ===================================================================
# JWT (HU-01)
# ===================================================================
jwt.secret=${JWT_SECRET:dev_only_change_in_production_9f7b1c3e}
jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:7}

# ===================================================================
# CORS Y FRONTEND URL (Producción en AWS / Desarrollo Local)
# ===================================================================
cors.allowed-origin=${CORS_ORIGIN:http://localhost:4200,https://erp-contable-comercial.online}
app.frontend-url=${FRONTEND_URL:https://erp-contable-comercial.online}

# ===================================================================
# USUARIO SEMILLA (Desarrollo)
# ===================================================================
seed.admin.email=${SEED_ADMIN_EMAIL:admin@erp.com}
seed.admin.password=${SEED_ADMIN_PASSWORD:Admin123!}

# ===================================================================
# PASARELA DE PAGOS STRIPE
# ===================================================================
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.public-key=${STRIPE_PUBLIC_KEY:}
stripe.restricted-key=${STRIPE_RESTRICTED_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

# ===================================================================
# GEMINI - CU39 ASISTENTE DE REPORTES POR VOZ
# Sin API key se usa el interprete local del backend.
# ===================================================================
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-flash-latest}
gemini.timeout-ms=${GEMINI_TIMEOUT_MS:20000}


