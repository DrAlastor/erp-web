# ===================================================================
# CONFIGURACIÓN GENERAL
# ===================================================================
spring.application.name=erp-backend
server.port=${SERVER_PORT:8080}
spring.main.allow-circular-references=true
spring.sql.init.mode=never
spring.config.import=optional:file:./.env.local[.properties]

# ===================================================================
# CONEXIÓN BASE DE DATOS (AWS RDS POSTGRESQL 16: ERP_Asus / ERP_Master)
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://erp-database.c49qmms6qw5e.us-east-1.rds.amazonaws.com:5432/ERP_Asus}
spring.datasource.username=${DB_USERNAME:AdminAWS}
spring.datasource.password=${DB_PASSWORD:Adminaws123!}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración del Pool HikariCP
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10

# ===================================================================
# BASE CENTRAL SAAS Y DATABASE-PER-TENANT
# ===================================================================
master.datasource.url=${MASTER_DB_URL:jdbc:postgresql://erp-database.c49qmms6qw5e.us-east-1.rds.amazonaws.com:5432/ERP_Master}
master.datasource.username=${MASTER_DB_USERNAME:AdminAWS}
master.datasource.password=${MASTER_DB_PASSWORD:Adminaws123!}
master.datasource.maximum-pool-size=${MASTER_DB_MAX_POOL_SIZE:5}

tenant.datasource.username=${TENANT_DB_USERNAME:AdminAWS}
tenant.datasource.password=${TENANT_DB_PASSWORD:Adminaws123!}
tenant.datasource.maximum-pool-size=${TENANT_DB_MAX_POOL_SIZE:5}

provisioning.datasource.url=${PROVISIONING_DB_URL:jdbc:postgresql://erp-database.c49qmms6qw5e.us-east-1.rds.amazonaws.com:5432/postgres}
provisioning.datasource.base-url=${PROVISIONING_DB_BASE_URL:jdbc:postgresql://erp-database.c49qmms6qw5e.us-east-1.rds.amazonaws.com:5432}
provisioning.datasource.username=${PROVISIONING_DB_USERNAME:AdminAWS}
provisioning.datasource.password=${PROVISIONING_DB_PASSWORD:Adminaws123!}
provisioning.rds-instance=${RDS_INSTANCE_IDENTIFIER:erp-prod-postgresql}
provisioning.rds-host=${RDS_HOST:erp-database.c49qmms6qw5e.us-east-1.rds.amazonaws.com}
provisioning.tenant-secret-arn=${TENANT_RUNTIME_SECRET_ARN:}
provisioning.schema-version=${TENANT_SCHEMA_VERSION:1.0.0}

# ===================================================================
# JPA / HIBERNATE 6
# ===================================================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================================================================
# FLYWAY (DESACTIVADO: BASE DE DATOS INICIALIZADA MEDIANTE SCRIPTS DDL)
# ===================================================================
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=false
app.demo-initializers.enabled=${DEMO_INITIALIZERS_ENABLED:false}

# ===================================================================
# JWT (HU-01)
# ===================================================================
jwt.secret=${JWT_SECRET:0793e09c40e6e55bb4c3a9dca66c9798d8ce07e5ed145be87799397c231eabbd}
jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:7}

# ===================================================================
# CORS Y FRONTEND URL (Producción en AWS / Desarrollo Local)
# ===================================================================
cors.allowed-origin=${CORS_ORIGIN:http://localhost:4200,https://erp-contable-comercial.online}
app.frontend-url=${FRONTEND_URL:https://erp-contable-comercial.online}

# ===================================================================
# SUBIDA DE ARCHIVOS (CU-06: logo de la empresa, máximo 512 KB)
# ===================================================================
spring.servlet.multipart.max-file-size=512KB
spring.servlet.multipart.max-request-size=1MB

# ===================================================================
# USUARIO SEMILLA (Desarrollo)
# ===================================================================
seed.admin.email=${SEED_ADMIN_EMAIL:admin@erp.com}
seed.admin.password=${SEED_ADMIN_PASSWORD:Admin123!}

# ===================================================================
# PASARELA DE PAGOS STRIPE
# ===================================================================
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.public-key=${STRIPE_PUBLIC_KEY:}
stripe.restricted-key=${STRIPE_RESTRICTED_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

# ===================================================================
# CATALOGOS GLOBALES: REST COUNTRIES
# ===================================================================
catalogos.paises.url=${CATALOGOS_PAISES_URL:https://api.restcountries.com/countries/v5}
catalogos.paises.token=${REST_COUNTRIES_API_TOKEN:}
catalogos.api.cache-minutes=${CATALOGOS_CACHE_MINUTES:360}
catalogos.api.connect-timeout-ms=${CATALOGOS_CONNECT_TIMEOUT_MS:3000}
catalogos.api.read-timeout-ms=${CATALOGOS_READ_TIMEOUT_MS:5000}

# ===================================================================
# AMAZON CLOUDWATCH LOGS - AUDITORÍA EXTERNA INMUTABLE (CU08)
# ===================================================================
aws.cloudwatch.enabled=${AWS_CLOUDWATCH_ENABLED:true}
aws.region=${AWS_REGION:us-east-1}
aws.cloudwatch.log-group=${AWS_CLOUDWATCH_LOG_GROUP:/aws/nexoerp/bitacora}
aws.accessKeyId=${AWS_ACCESS_KEY_ID:}
aws.secretAccessKey=${AWS_SECRET_ACCESS_KEY:}

# ===================================================================
# N8N - CU39 REPORTES POR COMANDO DE VOZ
# Sin URL se usa el interprete local del backend.
# ===================================================================
n8n.reportes-voz.webhook-url=${N8N_REPORTES_VOZ_URL:}
n8n.reportes-voz.token=${N8N_REPORTES_VOZ_TOKEN:}
n8n.reportes-voz.timeout-ms=${N8N_REPORTES_VOZ_TIMEOUT_MS:8000}

