# ===================================================================
# CONFIGURACIÓN GENERAL
# ===================================================================
spring.application.name=erp-backend
server.port=${SERVER_PORT:8080}

# ===================================================================
# CONEXIÓN BASE DE DATOS (POSTGRESQL 16 VÍA DOCKER EN PUERTO 5433)
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/erp_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración del Pool HikariCP
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10

# ===================================================================
# JPA / HIBERNATE 6 (Autodetecta dialecto PostgreSQL)
# ===================================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================================================================
# FLYWAY (MIGRACIONES DE BASE DE DATOS)
# ===================================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true

# ===================================================================
# JWT (HU-01)
# ===================================================================
jwt.secret=${JWT_SECRET:dev_only_change_in_production_9f7b1c3e}
jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:7}

# ===================================================================
# CORS
# ===================================================================
cors.allowed-origin=${CORS_ORIGIN:http://localhost:4200}

# ===================================================================
# USUARIO SEMILLA (Desarrollo)
# ===================================================================
seed.admin.email=${SEED_ADMIN_EMAIL:admin@erp.com}
seed.admin.password=${SEED_ADMIN_PASSWORD:Admin123!}
