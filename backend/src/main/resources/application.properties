# ===================================================================
# CONFIGURACIÓN GENERAL
# ===================================================================
spring.application.name=erp-backend
server.port=8080

# ===================================================================
# CONEXIÓN BASE DE DATOS (POSTGRESQL 16 VÍA DOCKER EN PUERTO 5433)
# ===================================================================
spring.datasource.url=jdbc:postgresql://localhost:5433/erp_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración del Pool HikariCP
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10

# ===================================================================
# JPA / HIBERNATE 6 (Autodetecta dialecto PostgreSQL)
# ===================================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================================================================
# FLYWAY (MIGRACIONES DE BASE DE DATOS)
# ===================================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
